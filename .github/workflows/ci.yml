name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint # oxlint: correctness, React, a11y, imports
      - run: npm run build # tsc --noEmit + vite build
      - run: npm test # Vitest unit/component tests

  e2e:
    name: E2E Chromium ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    # Firefox (and some container setups) refuse to launch unless $HOME is
    # owned by the process user — Actions mounts /github/home as uid 1001.
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Linux pixels differ from the committed *-darwin.png baselines, so
      # functional assertions still run while pixel comparisons are skipped.
      # Visual enforcement lives in the macos `visual` job below. To also
      # gate on Linux pixels: start Docker locally, run
      # `npx playwright test tests/e2e/visual.spec.ts --update-snapshots`
      # inside mcr.microsoft.com/playwright:v1.61.1-jammy, commit *-linux.png,
      # and drop `--ignore-snapshots` here.
      - run: npx playwright test --project=chromium --ignore-snapshots --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  visual:
    name: Visual regression (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Enforces the committed *-chromium-darwin.png baselines.
      - run: npx playwright test tests/e2e/visual.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-results
          path: test-results/
          retention-days: 7

  cross-browser:
    name: Cross-browser smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      HOME: /root
      # WebKit under 4 workers was starving the intro door click in CI.
      PLAYWRIGHT_WORKERS: "2"
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Critical journeys only — full suite stays on Chromium.
      - run: >
          npx playwright test
          --project=${{ matrix.project }}
          --ignore-snapshots
          tests/e2e/navigation.spec.ts
          tests/e2e/responsive.spec.ts
          tests/e2e/contact.spec.ts
          tests/e2e/mobile.spec.ts
          tests/e2e/foundations.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-${{ matrix.project }}
          path: test-results/
          retention-days: 7
